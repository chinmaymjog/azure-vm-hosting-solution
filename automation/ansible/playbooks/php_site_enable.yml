---
- name: Enable PHP site
  hosts: "{{ web_environment }}"
  become: true
  vars_files:
    - var_files/web_vars.yml

  tasks:
    - name: Enable site
      ansible.builtin.shell: a2ensite {{ site_url }}
      when:
        - site_url != ""

    - name: Read site metadata from persistent NFS store
      delegate_to: localhost
      run_once: true
      become: false
      ansible.builtin.command:
        cmd: "cat {{ SITE_LIST_PATH }}/{{ site_url }}.json"
      register: site_metadata_content
      failed_when: false
      changed_when: false
      when:
        - site_url != ""

    - name: Parse dynamic metadata facts
      ansible.builtin.set_fact:
        php_version_from_json: "{{ (hostvars['localhost']['site_metadata_content'].stdout | from_json).php_version if hostvars['localhost']['site_metadata_content'].rc == 0 else 'php8.5' }}"
      when:
        - site_url != ""

    - name: Start PHP-FPM service for {{ site_url }}
      ansible.builtin.systemd:
        name: "{{ php_version_from_json }}-fpm@{{ site_url }}"
        state: started
      when:
        - site_url != ""

    - name: Restart apache2
      ansible.builtin.systemd:
        name: apache2
        state: restarted
      when:
        - site_url != ""
