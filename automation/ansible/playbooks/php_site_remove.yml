---
- name: Deleting PHP Site
  hosts: "{{ web_environment }}"
  become: true
  vars_files:
    - var_files/web_vars.yml
    - var_files/database_vars.yml

  tasks:
    - name: Set environment-specific database variables
      set_fact:
        db_host: "{{ lookup('vars', web_environment).db_host }}"
        db_port: "{{ lookup('vars', web_environment).db_port | default(3306) }}"
        db_user: "{{ lookup('vars', web_environment).db_user }}"
        keyvault_name: "{{ lookup('vars', web_environment).keyvault_name }}"
        keyvault_secret: "{{ lookup('vars', web_environment).keyvault_secret }}"

    - name: Validate FQDN format
      delegate_to: localhost
      run_once: true
      become: false
      ansible.builtin.assert:
        that:
          - site_url is defined and site_url | length > 0
          - site_url is match('^[a-zA-Z0-9][-a-zA-Z0-9.]*\\.[a-zA-Z]{2,11}$')
        fail_msg: "🚨 Invalid FQDN '{{ site_url | default('') }}'! Domain must be a valid FQDN (e.g. example.com) without protocol prefixes (http://) or trailing slashes (/)."

    - name: Fetch Azure Managed Identity Token
      delegate_to: localhost
      run_once: true
      become: false
      ansible.builtin.uri:
        url: "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://vault.azure.net"
        headers:
          Metadata: "true"
        return_content: true
      register: token_response

    - name: Fetch MySQL Admin Password from Azure Key Vault
      delegate_to: localhost
      run_once: true
      become: false
      ansible.builtin.uri:
        url: "https://{{ keyvault_name }}.vault.azure.net/secrets/{{ keyvault_secret }}?api-version=7.0"
        headers:
          Authorization: "Bearer {{ (token_response.content | from_json).access_token }}"
        return_content: true
      register: secret_response

    - name: Set DB root password fact
      set_fact:
        db_pass: "{{ (secret_response.content | from_json).value }}"

    - name: Read site metadata from NetApp volume
      ansible.builtin.shell: |
        cat {{ DOC_ROOT }}/metadata/{{ site_url }}.json
      register: site_metadata_content
      failed_when: false
      when: site_url != ""

    - name: Parse dynamic metadata facts
      ansible.builtin.set_fact:
        username_from_json: "{{ (site_metadata_content.stdout | from_json).site_user if site_metadata_content.rc == 0 else '' }}"
        php_version_from_json: "{{ (site_metadata_content.stdout | from_json).php_version if site_metadata_content.rc == 0 else 'php8.5' }}"
      when:
        - site_metadata_content.rc is defined
        - site_metadata_content.rc == 0

    - name: Split PHP version string
      set_fact:
        php_name: "{{ php_version_from_json | default('php8.5') | regex_replace('([a-zA-Z]+)([0-9.]+)', '\\1') }}"
        php_number: "{{ php_version_from_json | default('php8.5') | regex_replace('([a-zA-Z]+)([0-9.]+)', '\\2') }}"

    - name: Checking if config file exist in sites-available
      ansible.builtin.stat:
        path: "{{ APACHE2_AVAILABLE }}/{{ site_url }}.conf"
      register: sites_available
      when:
        - site_url != ""

    - name: Checking if PHP config file exist
      ansible.builtin.stat:
        path: "/etc/php/{{ php_number }}/fpm/pool.d/{{ site_url }}.conf"
      register: php_available

    - name: Progress
      ansible.builtin.debug:
        msg:
          - "{{ site_url }} does not exist"
          - "Other tasks will be skipped"
      when:
        - sites_available.stat.exists == False
        - php_available.stat.exists == False

    - name: Stop PHP-FPM service for {{ site_url }}
      ansible.builtin.systemd:
        name: "{{ php_version_from_json | default('php8.5') }}-fpm@{{ site_url }}"
        enabled: true
        state: stopped
      when:
        - sites_available.stat.exists == True
        - php_available.stat.exists == True

    - name: Disable site
      ansible.builtin.shell: a2dissite {{ site_url }}
      when:
        - sites_available.stat.exists == True
        - php_available.stat.exists == True

    - name: Deleting site VHOST config
      ansible.builtin.file:
        path: "{{ APACHE2_AVAILABLE }}/{{ site_url }}.conf"
        state: absent
      when:
        - sites_available.stat.exists == True
        - php_available.stat.exists == True

    - name: Deleting php-fpm config
      ansible.builtin.file:
        path: "/etc/php/{{ php_number }}/fpm/pool.d/{{ site_url }}.conf"
        state: absent
      when:
        - sites_available.stat.exists == True
        - php_available.stat.exists == True

    - name: Deleting site user
      vars:
        site_user: "{{ username_from_json | default('') }}"
      ansible.builtin.user:
        name: "{{ site_user }}"
        state: absent
      when:
        - sites_available.stat.exists == True
        - php_available.stat.exists == True
        - site_user != ""

    - name: Restart apache2
      ansible.builtin.systemd:
        name: apache2
        state: restarted

    - name: Deleting database user
      delegate_to: localhost
      delegate_facts: true
      run_once: true
      become: false
      community.mysql.mysql_user:
        login_host: "{{ db_host }}"
        login_port: "{{ db_port }}"
        login_user: "{{ db_user }}"
        login_password: "{{ db_pass }}"
        name: "{{ username_from_json | default('') }}"
        state: absent
      when:
        - sites_available.stat.exists == True
        - php_available.stat.exists == True
        - username_from_json | default('') != ""

    - name: Deleting database
      delegate_to: localhost
      delegate_facts: true
      run_once: true
      become: false
      community.mysql.mysql_db:
        login_host: "{{ db_host }}"
        login_port: "{{ db_port }}"
        login_user: "{{ db_user }}"
        login_password: "{{ db_pass }}"
        name: "{{ username_from_json | default('') }}"
        state: absent
      when:
        - sites_available.stat.exists == True
        - php_available.stat.exists == True
        - username_from_json | default('') != ""

    - name: Deleting site metadata from persistent NetApp store
      ansible.builtin.file:
        path: "{{ DOC_ROOT }}/metadata/{{ site_url }}.json"
        state: absent
      when: sites_available.stat.exists == True

    - name: Output
      ansible.builtin.debug:
        msg:
          - "PHP site {{ site_url }} has been deleted successfully"
      when:
        - sites_available.stat.exists == True
        - php_available.stat.exists == True
