name: CI

on:
  pull_request:
  push:
    branches:
      - advanced

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25
        with:
          globs: |
            **/*.md
            !**/.terraform/**

  terraform:
    name: Terraform Fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: v1.17.2

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

  terraform-validate:
    name: Terraform Validate (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        component: [shared-hub, platform]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: v1.17.2

      - name: Terraform init and validate
        working-directory: infra/terraform/${{ matrix.component }}
        run: |
          terraform init -backend=false
          terraform validate
