name: IaC scan

# Scans the Terraform in infra/terraform/ with Trivy for
# misconfigurations. Report-only for now: findings are in the job log and the
# Security tab. Set exit-code to "1" on the table step to fail on HIGH/CRITICAL
# findings once the known ones are fixed. Also runs weekly. Not a required
# check: it is path-filtered on PRs.
on:
  pull_request:
    paths:
      - infra/terraform/**
      - .github/workflows/iac-scan.yml
  push:
    branches: [main]
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iac-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy IaC
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scan (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Upload report to Security tab
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-iac-terraform

      - name: Scan (table report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
