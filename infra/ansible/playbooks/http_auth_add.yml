---
- name: Creating HTTP auth credenttials
  hosts: "{{ web_environment }}"
  become: true
  vars_files:
    - var_files/web_vars.yml

  tasks:
    - name: Read site metadata from persistent NFS store
      delegate_to: localhost
      run_once: true
      become: false
      ansible.builtin.command:
        cmd: "cat {{ SITE_LIST_PATH }}/{{ site_url }}.json"
      register: site_metadata_content
      failed_when: false
      changed_when: false
      when:
        - site_url != ""

    - name: Parse dynamic metadata facts
      ansible.builtin.set_fact:
        username_from_json: "{{ (hostvars['localhost']['site_metadata_content'].stdout | from_json).site_user if hostvars['localhost']['site_metadata_content'].rc == 0 else '' }}"
        site_type_from_json: "{{ (hostvars['localhost']['site_metadata_content'].stdout | from_json).site_type if hostvars['localhost']['site_metadata_content'].rc == 0 else 'html' }}"
        php_version_from_json: "{{ (hostvars['localhost']['site_metadata_content'].stdout | from_json).php_version | default('') }}"
        status_from_json: "{{ (hostvars['localhost']['site_metadata_content'].stdout | from_json).status | default('enabled') }}"
        created_at_from_json: "{{ (hostvars['localhost']['site_metadata_content'].stdout | from_json).created_at if hostvars['localhost']['site_metadata_content'].rc == 0 else '' }}"
      when:
        - site_url != ""

    - name: Checking if config file exist in sites-available
      ansible.builtin.stat:
        path: "{{ APACHE2_AVAILABLE }}/{{ site_url }}.conf"
      register: sites_available
      when:
        - site_url != ""

    - name: Checking if config file exist in auth-files
      vars:
        site_user: "HTTP_{{ username_from_json | upper }}"
      ansible.builtin.stat:
        path: "{{ AUTH_FILES }}/{{ site_user }}"
      register: auth_files_state
      when:
        - site_url != ""

    - name: Checking if config file exist in auth-available
      ansible.builtin.stat:
        path: "{{ AUTH_AVAILABLE }}/{{ site_url }}.conf"
      register: auth_available
      when:
        - site_url != ""

    - name: Progress
      ansible.builtin.debug:
        msg:
          - "{{ site_url }} does not exist"
          - "Other tasks will be skipped"
      when: sites_available.stat.exists == False

    - name: Creating site user password
      delegate_to: localhost
      delegate_facts: true
      run_once: true
      become: false
      ansible.builtin.shell: |
        pass=$(openssl rand -hex 12)
        echo $pass
      register: site_auth_pass
      when:
        - sites_available.stat.exists == True
        - auth_files_state.stat.exists == False
        - auth_available.stat.exists == False

    - name: Add a user and password to file and set permissions
      vars:
        site_user: "HTTP_{{ username_from_json | upper }}"
      community.general.htpasswd:
        path: "{{ AUTH_FILES }}/{{ site_user }}"
        name: "HTTP_{{ username_from_json | upper }}"
        password: "{{ site_auth_pass.stdout }}"
        owner: root
        group: web_users
        mode: 0640
      when:
        - sites_available.stat.exists == True
        - auth_files_state.stat.exists == False
        - auth_available.stat.exists == False

    - name: adding auth VHOST config
      vars:
        site_user: "{{ username_from_json }}"
        site_authuser: "HTTP_{{ username_from_json | upper }}"
      ansible.builtin.template:
        src: templates/http_auth.j2
        dest: "{{ AUTH_AVAILABLE }}/{{ site_url }}.conf"
        mode: "644"
      when:
        - sites_available.stat.exists == True
        - auth_files_state.stat.exists == False
        - auth_available.stat.exists == False

    - name: Write updated site metadata to persistent NFS store
      delegate_to: localhost
      run_once: true
      become: false
      ansible.builtin.copy:
        content: "{{ site_metadata | to_nice_json }}"
        dest: "{{ SITE_LIST_PATH }}/{{ site_url }}.json"
        mode: "0644"
      vars:
        site_metadata:
          site_url: "{{ site_url }}"
          site_user: "{{ username_from_json }}"
          site_type: "{{ site_type_from_json }}"
          php_version: "{{ php_version_from_json if php_version_from_json != '' else omit }}"
          status: "{{ status_from_json }}"
          auth_status: "enabled"
          created_at: "{{ created_at_from_json }}"
          http_auth_user: "HTTP_{{ username_from_json | upper }}"
          http_auth_pass: "{{ site_auth_pass.stdout }}"
      when:
        - sites_available.stat.exists == True
        - auth_files_state.stat.exists == False
        - auth_available.stat.exists == False
